<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b1020" />
<title>Under Maintenance — We'll Be Back Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  /* ============ RESET ============ */
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #eaf2ff;
    /* Fallback colour if abc.png hasn't loaded yet */
    background: linear-gradient(135deg, #070b18 0%, #131a35 45%, #0a0f22 100%);
  }

  /* ============ BACKGROUND IMAGE (abc.png) ============ */
  /* Put abc.png in the SAME folder as this index.html file */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url("abc.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    transform-origin: center;
    animation: kenburns 30s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes kenburns {
    0%   { transform: scale(1)    translate3d(0, 0, 0); }
    100% { transform: scale(1.12) translate3d(-1.5%, -1.5%, 0); }
  }

  /* ============ DARK OVERLAY FOR READABILITY ============ */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse at 50% 45%,
        rgba(4, 8, 20, 0.35) 0%,
        rgba(4, 8, 20, 0.68) 55%,
        rgba(2, 4, 12, 0.92) 100%),
      linear-gradient(180deg, rgba(3, 7, 18, 0.55) 0%, rgba(3, 7, 18, 0.75) 100%);
  }

  /* ============ AMBIENT GLOW BLOBS ============ */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 2;
  }
  .glow-1 {
    width: 440px; height: 440px;
    background: #2563eb;
    top: -140px; left: -130px;
    animation: float1 16s ease-in-out infinite;
  }
  .glow-2 {
    width: 400px; height: 400px;
    background: #7c3aed;
    bottom: -160px; right: -120px;
    animation: float2 20s ease-in-out infinite;
  }
  .glow-3 {
    width: 300px; height: 300px;
    background: #06b6d4;
    top: 55%; left: 8%;
    opacity: 0.25;
    animation: float1 22s ease-in-out infinite reverse;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(60px, 50px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-70px, -40px) scale(1.2); }
  }

  /* ============ GLASS CARD ============ */
  .card {
    position: relative;
    z-index: 5;
    width: min(92vw, 640px);
    padding: 52px 44px 46px;
    text-align: center;
    border-radius: 30px;
    background: rgba(13, 20, 40, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow:
      0 30px 90px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 1px 0 rgba(255, 255, 255, 0.14) inset;
    animation: rise 1s cubic-bezier(0.2, 0.85, 0.25, 1) both;
    overflow: hidden;
  }

  /* Animated top accent line */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #22d3ee, #818cf8, #e879f9, #22d3ee);
    background-size: 300% 100%;
    animation: slideGradient 6s linear infinite;
  }

  @keyframes slideGradient {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(38px) scale(0.96); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* ============ BADGE ============ */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 18px;
    margin-bottom: 28px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #a5e8ff;
    background: rgba(34, 211, 238, 0.1);
    border: 1px solid rgba(34, 211, 238, 0.32);
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.18);
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22d3ee;
    animation: pulse 2s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.75); }
    70%  { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
  }

  /* ============ ICON / GEARS ============ */
  .icon-wrap {
    position: relative;
    width: 118px;
    height: 118px;
    margin: 0 auto 28px;
    display: grid;
    place-items: center;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(125, 211, 252, 0.45);
    animation: spin 14s linear infinite;
  }

  .ring::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(129, 140, 248, 0.2);
  }

  .gear {
    width: 58px;
    height: 58px;
    color: #7dd3fc;
    animation: spin 9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.75));
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ============ TEXT ============ */
  h1 {
    font-size: clamp(1.75rem, 5.2vw, 2.85rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
    background: linear-gradient(100deg, #ffffff 0%, #a5d8ff 30%, #c4b5fd 55%, #ffffff 85%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine {
    to { background-position: 220% center; }
  }

  .sub {
    font-size: clamp(0.9rem, 2.4vw, 1rem);
    font-weight: 300;
    line-height: 1.75;
    color: rgba(224, 236, 255, 0.78);
    max-width: 460px;
    margin: 0 auto;
  }

  /* ============ PROGRESS BAR ============ */
  .progress {
    position: relative;
    height: 6px;
    width: min(100%, 380px);
    margin: 32px auto 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  .bar {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 42%;
    border-radius: 999px;
    background: linear-gradient(90deg, #22d3ee, #818cf8, #e879f9);
    box-shadow: 0 0 16px rgba(129, 140, 248, 0.9);
    animation: slide 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(340%); }
  }

  /* ============ LOADING DOTS ============ */
  .dots {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin-top: 26px;
  }

  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7dd3fc;
    box-shadow: 0 0 10px rgba(125, 211, 252, 0.8);
    animation: bounce 1.4s ease-in-out infinite both;
  }

  .dots span:nth-child(2) { animation-delay: 0.16s; background: #a5b4fc; }
  .dots span:nth-child(3) { animation-delay: 0.32s; background: #d8b4fe; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.45; }
    40%           { transform: scale(1.15); opacity: 1; }
  }

  /* ============ FOOTER NOTE ============ */
  .note {
    margin-top: 28px;
    font-size: 0.76rem;
    letter-spacing: 0.6px;
    color: rgba(200, 216, 240, 0.5);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 520px) {
    .card { padding: 40px 24px 36px; border-radius: 24px; }
    .icon-wrap { width: 96px; height: 96px; margin-bottom: 22px; }
    .gear { width: 48px; height: 48px; }
    .badge { font-size: 0.65rem; padding: 7px 14px; letter-spacing: 1.2px; }
  }

  /* ============ ACCESSIBILITY ============ */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>

<body>

  <!-- Background image layer (abc.png) -->
  <div class="bg" aria-hidden="true"></div>

  <!-- Dark gradient overlay -->
  <div class="overlay" aria-hidden="true"></div>

  <!-- Ambient glows -->
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>
  <div class="glow glow-3" aria-hidden="true"></div>

  <!-- Main content card -->
  <main class="card" role="main">

    <div class="badge">
      <span class="pulse-dot"></span>
      Maintenance in progress
    </div>

    <div class="icon-wrap" aria-hidden="true">
      <div class="ring"></div>
      <svg class="gear" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>

    <h1>We'll Be Back Soon</h1>

    <p class="sub">
      Our website is currently undergoing scheduled maintenance.
      We're upgrading a few things behind the scenes to serve you better.
      Thank you for your patience!
    </p>

    <div class="progress" aria-hidden="true">
      <div class="bar"></div>
    </div>

    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <p class="note">Please check back in a little while ✦</p>

  </main>

</body>
</html>
